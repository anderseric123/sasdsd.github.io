    .atlas-map {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 68px;
      height: 42px;
      border-radius: 8px;
      background: linear-gradient(135deg, #edf2f7, #e2e8f0);

    }

    .chain-link {
      position: absolute;
      height: 2px;
      background: rgba(255, 90, 0, .33);
      transform-origin: left center;
      border-radius: 99px;
    }

    .chain-link.l1 { left: 35px; top: 44px; width: 52px; transform: rotate(-12deg); }
    .chain-link.l2 { left: 44px; top: 57px; width: 46px; transform: rotate(16deg); }
    .chain-link.l3 { left: 58px; top: 35px; width: 38px; transform: rotate(30deg); }

    .chain-node {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 90, 0, .14);
    }

    .chain-node.n1 { left: 28px; top: 39px; }
    .chain-node.n2 { left: 81px; top: 28px; }
    .chain-node.n3 { left: 89px; top: 58px; }
    .chain-node.n4 { left: 104px; top: 45px; }

    .kline {
      position: absolute;
      right: 12px;
      bottom: 14px;
      width: 62px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #f1f1f1;
      background: #fff;
      overflow: hidden;
    }

    .kline::before {

      left: 7px;
      right: 7px;
      top: 8px;
      bottom: 8px;

    .commodity-chip {

      border-radius: 999px;
      padding: 3px 8px;

    .today-hot-item-title {

      line-height: 1.35;
      font-weight: 800;
      color: #232323;

    .today-hot-meta {

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .today-hot-chip {

      padding: 3px 7px;
      border-radius: 999px;
      background: #fff4ed;
      color: #d55500;
      font-weight: 700;
      white-space: nowrap;
    }

    .today-hot-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #9a9a9a;
      font-size: 12px;
      padding: 10px 0;

    .recommend {

      min-height: 66px;
      border: 1px solid #f0f0f0;
      border-radius: 15px;

      align-items: stretch;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,.025);

    .recommend-label {

      padding: 0 18px;

      align-items: center;
      gap: 8px;
      background: #fff3ec;
      color: #222;
      font-size: 15px;
      font-weight: 900;

      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;

    .recommend-shield {

      font-size: 20px;
    }

    .grid {

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 12px;
    }

    .load-more-wrap {
      padding: 0 16px 18px;
      display: none;
    }

    .load-more-wrap.show {
      display: block;
    }

    .load-more-btn {

      height: 42px;

      font-size: 14px;
      font-weight: 800;

    .card {

      border: 1px solid #f0f0f0;
      box-shadow: 0 5px 16px rgba(0,0,0,.035);

    .thumb {

      overflow: hidden;
      position: relative;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      will-change: transform;
      display: block;
    }

    .thumb-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 12px;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 950;
      color: #fff;
      background: linear-gradient(135deg, #222, #555);
    }

    .card-body {
      padding: 10px 10px 12px;
      min-height: 86px;
      position: relative;
    }

    .card-title {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 6px;
      color: #202020;
      min-height: 40px;
    }

    .card-desc {
      font-size: 11px;
      line-height: 1.4;
      color: #909090;
      padding-right: 2px;
      min-height: 30px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

    .view-btn {
      margin-top: 6px;
      float: right;
      border: 0;
      background: transparent;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 0;
      border-radius: 0;
      cursor: pointer;
    }

    .bottom-actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 430px);
      z-index: 40;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e8e8e8;
      box-shadow: 0 -5px 20px -5px rgba(0,0,0,.12);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .bottom-actions-inner {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .share-page-btn,

      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s ease, filter .15s ease;

    .share-page-btn {
      display: none;
      background: #111827;
      color: #f5c35b;
      border: 1px solid rgba(245,195,91,.35);
      gap: 8px;
      font-size: 14px;
      font-weight: 700;

    .download-btn {
      background: linear-gradient(90deg, #d4a62a 0%, #f4d47b 50%, #d4a62a 100%);
      color: #111827;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(212,166,42,.22);
      flex-direction: column;
      gap: 1px;

    .download-btn .primary {
      font-size: 14px;
      line-height: 1;
    }

    .download-btn .secondary {
      font-size: 10px;
      line-height: 1;
      opacity: .78;
      transform: scale(.92);
    }

    .share-page-btn:active,
    .download-btn:active {
      transform: scale(.98);
    }

    .share-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
    }

    .share-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .risk {
      text-align: center;
      color: #b8b8b8;
      font-size: 12px;
      padding: 0 0 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: stretch;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-inner {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-top {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      flex: 0 0 auto;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 12px;
    }

    .close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }

    .modal-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
    }

    .modal-scroll img {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #fff;
    }

    .modal-fallback {
      min-height: 720px;
      border-radius: 14px;
      background: #fff;
      padding: 40px 24px;
      color: #111;
      font-size: 28px;
      font-weight: 950;
      line-height: 1.25;
    }

    .detail-block {
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid #ededed;
      background: #fff;
      padding: 10px 12px;
    }

    .detail-label {
      font-size: 12px;
      color: #9a9a9a;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .detail-text {
      font-size: 13px;
      line-height: 1.6;

    }

    .related-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .related-btn {
      border: 1px solid #f0d7c6;
      border-radius: 999px;
      background: #fff7f0;
      color: #d45500;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      cursor: pointer;
    }

    .detail-share-btn {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff7a1a 0%, #ff5a00 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 380px) {
      .hero h1 {
        font-size: 30px;
      }
      .hero .desc {
        width: 70%;
        font-size: 14px;
      }
      .hero-visual {
        width: 142px;
        right: -4px;
      }
      .grid {
        gap: 12px 10px;
      }
      .thumb {
        height: 112px;
      }
      .open-btn {
        padding: 10px 16px;
      }
      .phone {
        right: 92px;
      }
    }
  </style>
</head>

    }

    function buildMoveSignal(item, index) {
      const basis = ((index * 17 + new Date().getDate() * 7) % 36) / 10;
      const sign = index % 2 === 0 ? "+" : "-";
      return `${sign}${basis.toFixed(1)}%`;
    }

    const cardItems = cards.map((item, index) => {
      const normalizedCategory = categoryMap[item.category] || item.category;
      const keywords = inferKeywords(item);
      return {
        ...item,
        topic: item.title,
        title: asQuestionTitle(item.title, index),
        category: normalizedCategory,
        keywords,
        intro: buildIntro(item),
        source: "金十数据中心 / 公开资料整理",
        risk: "图谱仅供研究交流，不构成任何投资建议。请结合实时行情独立判断。",
        marketMove: buildMoveSignal(item, index),
        isTodayHot: todayHotTopics.has(item.title) || ["原油", "铜", "碳酸锂", "生猪"].some(k => keywords.includes(k)),
        uid: `${normalizedCategory}-${index}`,
      };
    });

    let currentCategory = "全部";
    let searchQuery = "";
    const ALL_INITIAL_COUNT = 4;
    const ALL_INCREMENT_COUNT = 4;
    let allVisibleCount = ALL_INITIAL_COUNT;

    const tabsEl = document.getElementById("tabs");
    const gridEl = document.getElementById("grid");
    const todayHotListEl = document.getElementById("todayHotList");
    const todayHotTimeEl = document.getElementById("todayHotTime");
    const searchInputEl = document.getElementById("searchInput");
    const loadMoreWrapEl = document.getElementById("loadMoreWrap");
    const loadMoreBtnEl = document.getElementById("loadMoreBtn");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalContent = document.getElementById("modalContent");

    function renderTabs() {
      tabsEl.innerHTML = categories.map(cat => `
        <button class="tab ${cat === currentCategory ? "active" : ""}" data-cat="${cat}">
          ${cat}
        </button>
      `).join("");

      document.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.cat;
          if (currentCategory === "全部") {
            allVisibleCount = ALL_INITIAL_COUNT;
          }
          renderTabs();
          renderTodayHot();
          renderGrid();
        });
      });
    }

    function filteredCards() {
      let list = cardItems;

      if (currentCategory !== "全部") {
        list = list.filter(item => item.category === currentCategory);
      }

      const q = searchQuery.trim().toLowerCase();
      if (!q) return list;

      return list.filter(item => {
        const blob = `${item.title}${item.topic}${item.desc}${item.keywords.join("|")}`.toLowerCase();
        return blob.includes(q);
      });
    }

    function imageWithFallback(item, className = "") {
      return `
        <img src="${item.image}" alt="${item.title}" loading="eager" decoding="async" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="thumb-fallback" style="display:none;">${item.title}</div>
      `;
    }

    function renderTodayHot() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      todayHotTimeEl.textContent = `${mm}-${dd} ${hh}:${mi} 更新`;

      const q = searchQuery.trim().toLowerCase();
      const hotList = cardItems
        .filter(item => item.isTodayHot)
        .filter(item => {
          if (!q) return true;
          const blob = `${item.title}${item.topic}${item.desc}${item.keywords.join("|")}`.toLowerCase();
          return blob.includes(q);
        })
        .slice(0, 6);

      if (!hotList.length) {
        todayHotListEl.innerHTML = `<div class="today-hot-empty">当前关键词下暂无今日热图</div>`;
        return;
      }

      todayHotListEl.innerHTML = hotList.map(item => `
        <article class="today-hot-item" onclick="openModal('${item.uid}')">
          <div class="today-hot-item-title">${item.title}</div>
          <div class="today-hot-meta">
            <span class="today-hot-chip">${item.category}</span>
          </div>
        </article>
      `).join("");
    }

    function renderGrid() {
      const list = filteredCards();
      const isAllCategory = currentCategory === "全部";
      const renderList = isAllCategory ? list.slice(0, allVisibleCount) : list;

      gridEl.innerHTML = renderList.map(item => `
        <article class="card" onclick="openModal('${item.uid}')">
          <div class="thumb">
            ${imageWithFallback(item)}
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
        </article>
      `).join("");

      if (isAllCategory && allVisibleCount < list.length) {
        loadMoreWrapEl.classList.add("show");
      } else {
        loadMoreWrapEl.classList.remove("show");
      }
    }

    function openModal(uid) {
      const item = cardItems.find(card => card.uid === uid);
      if (!item) return;

      modalTitle.textContent = item.title;
      modalContent.innerHTML = `
        <img src="${item.longImage}" alt="${item.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div class="modal-fallback" style="display:none;">
          ${item.title}<br><br>
          段子归段子，数据要认真看。
        </div>
      `;
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    document.getElementById("closeModal").addEventListener("click", () => {
      modal.classList.remove("show");
      document.body.style.overflow = "";
    });

    modal.addEventListener("click", e => {
      if (e.target === modal) {
        modal.classList.remove("show");
        document.body.style.overflow = "";
      }
    });

    function handleSharePage() {
      if (typeof window.Jin10JSBridge !== "undefined") {
        try {
          const bridge = new window.Jin10JSBridge();
          if (bridge.isApp) {
            bridge.dispatch("appShare", { url: location.href });
          }
        } catch (e) {}
      }
    }

    function initAppEnvironment() {
      const downloadBtn = document.getElementById("download-btn");
      const shareBtn = document.getElementById("sharePageBtn");

      if (typeof window.Jin10JSBridge !== "undefined") {
        try {
          const bridge = new window.Jin10JSBridge();

          if (bridge.isApp) {
            if (shareBtn) shareBtn.style.display = "flex";
            if (downloadBtn) downloadBtn.style.display = "none";
          }
        } catch (e) {
          if (downloadBtn) downloadBtn.style.display = "flex";
        }
      }

      if (downloadBtn && downloadBtn.style.display !== "none") {
        downloadBtn.style.display = "flex";
      }

      if (shareBtn) {
        shareBtn.addEventListener("click", handleSharePage);
      }
    }

    function shareCurrentChart(uid) {
      const item = cardItems.find(card => card.uid === uid);
      const text = item ? `${item.title}｜金十期货热图库` : "金十期货热图库";

      if (typeof window.Jin10JSBridge !== "undefined") {
        try {
          const bridge = new window.Jin10JSBridge();
          if (bridge.isApp) {
            bridge.dispatch("appShare", { url: location.href, title: text });
            return;
          }
        } catch (e) {}
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(`${text} ${location.href}`).then(() => {
          alert("链接已复制，可直接分享给好友。");
        }).catch(() => {
          alert("当前环境不支持自动复制，可手动复制链接分享。");
        });
        return;
      }

      alert("当前环境不支持自动复制，可手动复制链接分享。");
    }

    document.addEventListener("DOMContentLoaded", initAppEnvironment);

    searchInputEl.addEventListener("input", e => {
      searchQuery = e.target.value || "";
      if (currentCategory === "全部") {
        allVisibleCount = ALL_INITIAL_COUNT;
      }
      renderTodayHot();
      renderGrid();
    });

    loadMoreBtnEl.addEventListener("click", () => {
      if (currentCategory !== "全部") return;
      allVisibleCount += ALL_INCREMENT_COUNT;
      renderGrid();
    });

    function preloadGalleryImages() {
      cardItems.forEach(item => {
        const img = new Image();
        img.decoding = "async";
        img.src = item.image;
      });
    }

    renderTabs();
    renderTodayHot();
    renderGrid();
    preloadGalleryImages();
  </script>
</body>
</html>
